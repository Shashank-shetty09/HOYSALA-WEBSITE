<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hoysala Website</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background-image:url("jersey.png");
    background-size:cover;
}

/* LOGO SCREEN */
#logoScreen{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background-image:url("jersey.png");
    background-size:cover;
    color:white;
}

#logoScreen img{
    width:180px;
    border-radius:10px;
}

/* MENU */
#menu{
    display:none;
    text-align:center;
    padding:20px;
}

.menuBtn{
    display:block;
    width:250px;
    margin:10px auto;
    padding:12px;
    background:#0b1f4d;
    color:rgb(248, 252, 249);
    border:none;
    cursor:pointer;
    border-radius:8px;
}

/* CONTENT */
.section{
    display:none;
    padding:20px;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:10px;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
}

th{
    background:#0b1f4d;
    color:white;
}

/* PLAYER LIST */
.player{
    padding:10px;
    background:rgb(3, 156, 226);
    margin:5px 0;
    cursor:pointer;
}

.player:hover{
    background:#e6f0ff;
}

/* PROFILE */
.profile{
    text-align:center;
    background:white;
    padding:20px;
}

.profile img{
    width:150px;
    border-radius:10px;
}

h2{
    background-color:rgba(4, 112, 162, 0.796);
    color:aquamarine;
}
h3{
    width:fit-content;
    background-color:rgba(4, 112, 162, 0.796);
    color:aquamarine;
    font-size:xx-large;
}
button{
    background-color: rgb(20, 131, 210);
    color: bisque;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
    <img src="logo.png">
    <h2>HOYSALA CRICKET TEAM</h2>
    <button onclick="enterSite()">ENTER THE SITE</button>
</div>

<!-- MENU -->
<div id="menu">
    <h3>Dashboard</h3>

    <button class="menuBtn" onclick="showSection('playerStats')">Player Stats</button>
    <button class="menuBtn" onclick="showSection('batting')">Batting Leaderboard</button>
    <button class="menuBtn" onclick="showSection('bowling')">Bowling Leaderboard</button>
    <button class="menuBtn" onclick="showSection('mvp')">MVP Leaderboard</button>
</div>

<!-- PLAYER STATS -->
<div id="playerStats" class="section"></div>

<!-- BATTING -->
<div id="batting" class="section"></div>

<!-- BOWLING -->
<div id="bowling" class="section"></div>

<!-- MVP -->
<div id="mvp" class="section"></div>

<script>

let battingData=[];
let bowlingData=[];

fetch("HOYSALA_STATS.xlsx")
.then(r=>r.arrayBuffer())
.then(d=>{

    const wb=XLSX.read(d,{type:"array"});

    battingData=XLSX.utils.sheet_to_json(wb.Sheets["BATTING"],{defval:""});
    bowlingData=XLSX.utils.sheet_to_json(wb.Sheets["BOWLING"],{defval:""});

});

/* ENTER */
function enterSite(){
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("menu").style.display="block";
}

/* MENU */
function showSection(id){
    document.querySelectorAll(".section").forEach(s=>s.style.display="none");
    document.getElementById(id).style.display="block";

    if(id==="playerStats") loadPlayers();
    if(id==="batting") loadBatting("RUNS");
    if(id==="bowling") loadBowling("WICKETS");
    if(id==="mvp") loadMVP();
}

/* PLAYER STATS */
function loadPlayers(){

    let div=document.getElementById("playerStats");

    div.innerHTML="<h2>Players</h2>";

    battingData.forEach(p=>{

        let name=p.BATSMAN;

        div.innerHTML+=`<div class="player" onclick="showPlayer('${name}')">${name}</div>`;
    });
}

function showPlayer(name){

    let bat=battingData.find(p=>p.BATSMAN==name);
    let bowl=bowlingData.find(p=>p.BOWLER==name);

    let img=name.toLowerCase()+".jpeg";

    let html=`
    <div class="profile">
        <img src="${img}" onerror="this.src='logo.jpg'">
        <h2>${name}</h2>
    </div>
    `;

    if(bat) html+=buildTable("Batting",bat);
    if(bowl) html+=buildTable("Bowling",bowl);

    document.getElementById("playerStats").innerHTML=html;
}

/* TABLE */
function buildTable(title,obj){
    let html=`<h3>${title}</h3><table>`;
    for(let k in obj){
        html+=`<tr><th>${k}</th><td>${obj[k]}</td></tr>`;
    }
    html+="</table>";
    return html;
}

/* BATTING LEADERBOARD */
function loadBatting(sortKey){

    let sorted=[...battingData];

    sorted.sort((a,b)=>(b[sortKey]||0)-(a[sortKey]||0));

    let html=`<h2>Batting Leaderboard (Sorted by ${sortKey})</h2>`;

    html+=`
    <button onclick="loadBatting('RUNS')">Runs</button>
    <button onclick="loadBatting('STRIKERATE')">SR</button>
    <button onclick="loadBatting('AVERAGE')">Avg</button>
    <button onclick="loadBatting('SIXES')">6s</button>
    <button onclick="loadBatting('FOURS')">4s</button>
    `;

    sorted.forEach(p=>{
        html+=`<div class="player">${p.BATSMAN} - ${p[sortKey]}</div>`;
    });

    document.getElementById("batting").innerHTML=html;
}

/* BOWLING LEADERBOARD */
function loadBowling(sortKey){

    let sorted=[...bowlingData];

    sorted.sort((a,b)=>(b[sortKey]||0)-(a[sortKey]||0));

    let html=`<h2>Bowling Leaderboard (Sorted by ${sortKey})</h2>`;

    html+=`
    <button onclick="loadBowling('WICKETS')">Wickets</button>
    <button onclick="loadBowling('ECONOMY')">Economy</button>
    <button onclick="loadBowling('3-W')">3W</button>
    <button onclick="loadBowling('5-W')">5W</button>
    `;

    sorted.forEach(p=>{
        html+=`<div class="player">${p.BOWLER} - ${p[sortKey]}</div>`;
    });

    document.getElementById("bowling").innerHTML=html;
}

/* MVP */
function loadMVP(){

    let map={};

    battingData.forEach(p=>{
        map[p.BATSMAN]=(map[p.BATSMAN]||0)+(p.RUNS*1.2);
    });

    bowlingData.forEach(p=>{
        map[p.BOWLER]=(map[p.BOWLER]||0)+(p.WICKETS*20);
    });

    let sorted=Object.entries(map)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10);

    let html="<h2>MVP Leaderboard</h2>";

    sorted.forEach(x=>{
        html+=`<div class="player">${x[0]} - ${x[1].toFixed(1)}</div>`;
    });

    document.getElementById("mvp").innerHTML=html;
}

</script>

</body>
</html>
