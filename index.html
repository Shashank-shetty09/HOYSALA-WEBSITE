<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoysala Cricket Team</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{margin:0;font-family:Segoe UI,sans-serif;background:#f3f4f6}
#logoScreen{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:url("jersey.png") center/cover;color:#fff}
#logoScreen img{width:180px}
#logoScreen button{padding:12px 30px;font-size:18px;border:none;border-radius:8px;background:#d71920;color:#fff}
#app{display:none}
.header{background:#d71920;color:#fff;padding:20px;display:flex;align-items:center;gap:15px}
.header img{width:90px;height:90px;background:#fff;border-radius:10px;padding:5px}
.mainTabs,.subTabs,.playerTabs{display:flex;background:#fff}
.mainTabs button,.subTabs button,.playerTabs button{flex:1;padding:14px;border:none;background:#fff;font-weight:700}
.section{padding:15px}
.player{
display:flex;
align-items:center;
gap:15px;
background:#fff;
margin:10px 0;
padding:12px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
cursor:pointer;
}

.player img{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
border:2px solid #ddd;
}

.badge{
display:inline-block;
padding:4px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
margin-top:4px;
background:#ffd700;
color:#000;
}

.playerInfo h4{
margin:0;
}

.playerInfo p{
margin:0;
color:#666;
}
.profileTop{display:flex;gap:15px;background:#fff;padding:15px;border-radius:10px}
.profileTop img{width:140px;height:140px;object-fit:cover;border-radius:10px}
.playerName{display:flex;align-items:center;font-size:28px;font-weight:bold}
.statsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:15px}
.card{background:#fff;padding:15px;border-radius:10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.label{font-size:13px;color:#666}
.value{font-size:28px;font-weight:bold;color:#0b1f4d}
table{width:100%;border-collapse:collapse;background:#fff}
th{background:#0b1f4d;color:#fff}
th,td{padding:10px;border:1px solid #ddd;text-align:center}
.backBtn{margin:10px 0;padding:10px 15px;border:none;background:#d71920;color:#fff;border-radius:8px}
</style>
</head>
<body>
<div id="logoScreen">
<img src="logo.png"><h1>HOYSALA CRICKET TEAM</h1>
<button onclick="enterSite()">VISIT</button>
</div>

<div id="app">
<div class="header"><img src="logo.png"><div><h2>HOYSALA</h2><div>Cricket Team</div></div></div>
<div class="mainTabs">
<button onclick="openTab('members')">MEMBERS</button>
<button onclick="openTab('leaderboard')">LEADERBOARD</button>
</div>
<div id="content" class="section"></div>
</div>

<script>
let battingData=[],bowlingData=[];

fetch("HOYSALA_STATS.xlsx").then(r=>r.arrayBuffer()).then(d=>{
const wb=XLSX.read(d,{type:"array"});
battingData=XLSX.utils.sheet_to_json(wb.Sheets["BATTING"],{defval:""});
bowlingData=XLSX.utils.sheet_to_json(wb.Sheets["BOWLING"],{defval:""});
});

function enterSite(){
logoScreen.style.display="none";
app.style.display="block";
openTab('members');
}

function openTab(tab){
if(tab==="members") loadMembers();
if(tab==="leaderboard") loadLeaderboardPage();
}

function getBattingBadge(p){

if(!p || p.MATCHES<20)
return "Aspirant";

if(+p.STRIKERATE>=180)
return "Destroyer";

if(+p.STRIKERATE>=150)
return "Hard Hitter";

if(+p.STRIKERATE>=120)
return "Accumulator";

return "Classicist";
}

function getBowlingBadge(p){

if(!p || p.MATCHES<20)
return "";

if(+p.WICKETS>=100)
return "Spearhead";

if(+p.ECONOMY<=7)
return "Economist";

if(+p.WICKETS>=40)
return "Wild Card";

return "Underdog";
}

function loadMembers(){

let html="<h2>Team Members</h2>";

battingData.forEach(p=>{

let bowl=bowlingData.find(x=>x.BOWLER===p.BATSMAN);

let badge=getBattingBadge(p);

let bowlBadge=getBowlingBadge(bowl);

if(bowlBadge)
badge+=" • "+bowlBadge;

let img=p.BATSMAN.toLowerCase()+".jpeg";

html+=`
<div class="player"
onclick="showPlayer('${p.BATSMAN}')">

<img src="${img}"
onerror="this.src='logo.png'">

<div class="playerInfo">

<h4>${p.BATSMAN}</h4>

<span class="badge">${badge}</span>

</div>

</div>
`;
});

content.innerHTML=html;
}

function showPlayer(name){

let img=name.toLowerCase()+".jpeg";

let bat=battingData.find(x=>x.BATSMAN===name);
let bowl=bowlingData.find(x=>x.BOWLER===name);

let badge=getBattingBadge(bat);

let bowlBadge=getBowlingBadge(bowl);

if(bowlBadge)
badge+=" • "+bowlBadge;

content.innerHTML=`
<button class="backBtn" onclick="loadMembers()">← Back</button>

<div class="profileTop">

<img src="${img}" onerror="this.src='logo.png'">

<div>

<div class="playerName">${name}</div>

<div class="badge">${badge}</div>

</div>

</div>

<div class="playerTabs">
<button onclick="showBatting('${name}')">BATTING</button>
<button onclick="showBowling('${name}')">BOWLING</button>
</div>

<div id="playerData"></div>
`;

showBatting(name);
}

function renderStats(obj,stats){
let h='<div class="statsGrid">';
stats.forEach(s=>h+=`<div class="card"><div class="label">${s[1]}</div><div class="value">${obj[s[0]]||0}</div></div>`);
h+='</div>';
playerData.innerHTML=h;
}

function showBatting(name){
let p=battingData.find(x=>x.BATSMAN===name);
renderStats(p,[["MATCHES","Matches"],["INNINGS","Innings"],["RUNS","Runs"],["BALLS","Balls"],["NOT OUTS","Not Outs"],["STRIKERATE","SR"],["AVERAGE","Average"],["FOURS","Fours"],["SIXES","Sixes"],["50","50s"],["BEST","Best"]]);
}

function showBowling(name){
let p=bowlingData.find(x=>x.BOWLER===name);
if(!p){playerData.innerHTML="<h3>No Bowling Data</h3>";return;}
renderStats(p,[["MATCHES","Matches"],["OVERS","Overs"],["WICKETS","Wickets"],["RUNS","Runs"],["ECONOMY","Economy"],["AVERAGE","Average"],["STRIKE RATE","SR"],["3-W","3W"],["5-W","5W"],["BEST","Best"]]);
}

function openPlayer(name){
showPlayer(name);
}

function loadLeaderboardPage(){
content.innerHTML=`
<div class="subTabs">
<button onclick="loadBattingBoard()">BATTING</button>
<button onclick="loadBowlingBoard()">BOWLING</button>
<button onclick="loadMVP()">MVP</button>
</div>
<div id="board"></div>`;
loadBattingBoard();
}

function loadBattingBoard(sortKey="RUNS"){

let s=[...battingData];

s.sort((a,b)=>
(+b[sortKey]||0)-(+a[sortKey]||0)
);

let h=`

<select onchange="loadBattingBoard(this.value)">

<option value="RUNS">Runs</option>

<option value="AVERAGE">Average</option>

<option value="STRIKERATE">Strike Rate</option>

<option value="FOURS">Fours</option>

<option value="SIXES">Sixes</option>

<option value="50">50s</option>

</select>

`;

s.forEach((p,i)=>{

let img=p.BATSMAN.toLowerCase()+".jpeg";

h+=`

<div class="player"

onclick="openPlayer('${p.BATSMAN}')">

<img src="${img}"
onerror="this.src='logo.png'">

<div style="flex:1">

<b>#${i+1} ${p.BATSMAN}</b>

<br>

Runs:${p.RUNS}
 | Avg:${p.AVERAGE}
 | SR:${p.STRIKERATE}

</div>

<div>

<b>${p[sortKey]}</b>

</div>

</div>
`;
});

board.innerHTML=h;
}

function loadBowlingBoard(sortKey="WICKETS"){

let s=[...bowlingData];

if(sortKey==="ECONOMY"||sortKey==="AVERAGE"||sortKey==="STRIKE RATE"){

s.sort((a,b)=>
(+a[sortKey]||999)-(+b[sortKey]||999)
);

}else{

s.sort((a,b)=>
(+b[sortKey]||0)-(+a[sortKey]||0)
);

}

let h=`

<select onchange="loadBowlingBoard(this.value)">

<option value="WICKETS">Wickets</option>

<option value="ECONOMY">Economy</option>

<option value="AVERAGE">Average</option>

<option value="STRIKE RATE">Strike Rate</option>

<option value="3-W">3W</option>

<option value="5-W">5W</option>

</select>

`;

s.forEach((p,i)=>{

let img=p.BOWLER.toLowerCase()+".jpeg";

h+=`

<div class="player"

onclick="openPlayer('${p.BOWLER}')">

<img src="${img}"
onerror="this.src='logo.png'">

<div style="flex:1">

<b>#${i+1} ${p.BOWLER}</b>

<br>

Wkts:${p.WICKETS}
 | Eco:${p.ECONOMY}
 | Avg:${p.AVERAGE}

</div>

<div>

<b>${p[sortKey]}</b>

</div>

</div>
`;
});

board.innerHTML=h;
}

function loadMVP(){

let players={};

/* Batting Points */
battingData.forEach(p=>{

let battingScore=
(+p.RUNS||0)+
(+p.FOURS||0)+
((+p.SIXES||0)*2)+
((+p["50"]||0)*20);

if(!players[p.BATSMAN]){
players[p.BATSMAN]={
batting:0,
bowling:0
};
}

players[p.BATSMAN].batting=battingScore;

});

/* Bowling Points */
bowlingData.forEach(p=>{

let bowlingScore=
((+p.WICKETS||0)*25)+
((+p["3-W"]||0)*15)+
((+p["5-W"]||0)*35);

if(!players[p.BOWLER]){
players[p.BOWLER]={
batting:0,
bowling:0
};
}

players[p.BOWLER].bowling=bowlingScore;

});

/* Sort by Total MVP Points */
let s=Object.entries(players)
.sort((a,b)=>
(b[1].batting+b[1].bowling)-
(a[1].batting+a[1].bowling)
);

let h="<h2>MVP Leaderboard</h2>";

s.forEach((p,i)=>{

let img=p[0].toLowerCase()+".jpeg";

let total=
p[1].batting+
p[1].bowling;

h+=`

<div class="player">

<img src="${img}"
onerror="this.src='logo.png'">

<div style="flex:1">

<b>#${i+1} ${p[0]}</b>

<br>

<small>
Batting: ${p[1].batting.toFixed(0)}
 |
 Bowling: ${p[1].bowling.toFixed(0)}
</small>

</div>

<div>

<b>${total.toFixed(0)}</b>

</div>

</div>

`;

});

board.innerHTML=h;

}

</script>
</body>
</html>
