<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
body{margin:0;font-family:Segoe UI,sans-serif;background:#f3f4f6}
#logoScreen{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:url("jersey.png") center/cover;color:#fff}

#logoScreen button{

margin:10px 0;
padding:12px;

}

height:60px;

display:inline-block;
padding:4px 10px;

margin-top:4px;

}

}
.profileTop{display:flex;gap:15px;background:#fff;padding:15px;border-radius:10px}
.profileTop img{width:140px;height:140px;object-fit:cover;border-radius:10px}

.statsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:15px}

</head>
<body>
<div id="logoScreen">
<img src="logo.png"><h1>HOYSALA CRICKET TEAM</h1>
<button onclick="enterSite()">VISIT</button>

</div>

<div id="app">
<div class="header">
<img src="logo.png">
<div>
<h2>HOYSALA</h2>
<div>🌍MSRIT,Bangalore</div>
</div>
</div>

<div class="mainTabs">
<button id="playersBtn" class="active" onclick="setActiveButton(this); openTab('players')">PLAYERS</button>
<button onclick="setActiveButton(this); openTab('leaderboard')">LEADERBOARD</button>
<button onclick="setActiveButton(this); openTab('records')">RECORDS</button>
<button onclick="setActiveButton(this); openTab('milestones')">MILESTONES</button>
<button onclick="setActiveButton(this); openTab('gallery')">GALLERY</button>
<button onclick="setActiveButton(this); openTab('details')">DETAILS</button>
</div>

<div id="content" class="section"></div>

</div>

<script>
let battingData=[],bowlingData=[];

function extractRuns(best){
    best = String(best).trim();
    let match = best.match(/^(\d+)/);
    return match ? parseInt(match[1]) : 0;
}

function extractWickets(spell){
    let parts = String(spell).split("-");
    return parseInt(parts[3]) || 0;
}

function extractRunsGiven(spell){
    let parts = String(spell).split("-");
    return parseInt(parts[2]) || 999;
}

fetch("HOYSALA_STATS.xlsx").then(r=>r.arrayBuffer()).then(d=>{
const wb=XLSX.read(d,{type:"array"});
battingData=XLSX.utils.sheet_to_json(wb.Sheets["BATTING"],{defval:""});
bowlingData=XLSX.utils.sheet_to_json(wb.Sheets["BOWLING"],{defval:""});
});

function enterSite(){
    document.getElementById("logoScreen").style.opacity="0";

    setTimeout(()=>{
        logoScreen.style.display="none";
        app.style.display="block";
        openTab('players');
    },500);
}

function openTab(tab){
    if(tab==="players") loadPlayers();
    if(tab==="leaderboard") loadLeaderboardPage();
    if(tab==="records") loadRecords();
    if(tab==="milestones") loadMilestones();
    if(tab==="milestones") loadMilestones();
    if(tab==="gallery") loadGallery();
    if(tab==="details") loadDetails();
}

function setActiveButton(button){
    let parent = button.parentElement;
    parent.querySelectorAll("button").forEach(btn=>{
        btn.classList.remove("active");
    });
    button.classList.add("active");
}

function getBattingBadge(p){
if(!p||p.MATCHES<15||p.STRIKERATE<110)
return "";
if(+p.STRIKERATE>=180)
return "🏏DESTROYER";
if(+p.STRIKERATE>=150)
return "🏏HARD HITTER";
if(+p.STRIKERATE>=130)
return "🏏ACCUMULATOR";
return "🏏CLASSICIST";
}

function getBowlingBadge(p){
if(!p||p.WICKETS<15)
return "";
if(+p.WICKETS>=100)
return "🥎SPEARHEAD";
if(+p.WICKETS>=80)
return "🥎VETERAN";
if(+p.WICKETS >= 60)
return "🥎STRIKE LEADER";
if(+p.ECONOMY<=8)
return "🥎ECONOMIST";
if(+p.WICKETS>=40)
return "🥎WILD CARD";
if(+p.WICKETS>=15)
return"🥎ASPIRANT";
}

function loadPlayers(){
let html="";

battingData.forEach(p=>{
let bowl=bowlingData.find(x=>x.BOWLER===p.BATSMAN);
let badge=getBattingBadge(p);
let bowlBadge=getBowlingBadge(bowl);

if(bowlBadge)
badge+=" "+bowlBadge;

let img=p.BATSMAN.toLowerCase()+".jpeg";

html+=`
<div class="player"
onclick="showPlayer('${p.BATSMAN}')">
<img src="${img}"
onerror="this.src='logo.png'">
<div class="playerInfo">
<h4>${p.BATSMAN}</h4>
<span class="badge">${badge}</span>
</div>
</div>
`;
});
content.innerHTML=html;
}

function showPlayer(name){
let img=name.toLowerCase()+".jpeg";
let bat=battingData.find(x=>x.BATSMAN===name);
let bowl=bowlingData.find(x=>x.BOWLER===name);
let badge=getBattingBadge(bat);
let bowlBadge=getBowlingBadge(bowl);

if(bowlBadge)
badge += " " + bowlBadge;
content.innerHTML=`
<button class="backBtn"
onclick="
loadPlayers();
document.querySelectorAll('.mainTabs button')
.forEach(b=>b.classList.remove('active'));
document.getElementById('playersBtn')
.classList.add('active');
">
← Back
</button>
<div class="profileTop">
<img src="${img}" onerror="this.src='logo.png'">
<div>
<div class="playerName">${name}</div>
<div class="badge">${badge}</div>
</div>
</div>
<div class="playerTabs">
<button class="active"
onclick="setActiveButton(this); showBatting('${name}')">BATTING</button>
<button onclick="setActiveButton(this); showBowling('${name}')">BOWLING</button>
</div>
<div id="playerData"></div>
`;
showBatting(name);
}

function renderStats(obj,stats){
let h='<div class="statsGrid">';
stats.forEach(s=>h+=`<div class="card"><div class="label">${s[1]}</div><div class="value">${obj[s[0]]||0}</div></div>`);
h+='</div>';
playerData.innerHTML=h;
}

function showBatting(name){
let p=battingData.find(x=>x.BATSMAN===name);
renderStats(p,[["MATCHES","Matches"],["INNINGS","Innings"],["RUNS","Runs"],["BALLS","Balls"],["NOT OUTS","Not Outs"],["STRIKERATE","SR"],["AVERAGE","Average"],["Balls/bdry","Balls/Boundary"],["FOURS","Fours"],["SIXES","Sixes"],["50","50s"],["BEST","Best"]]);
}

function showBowling(name){
let p=bowlingData.find(x=>x.BOWLER===name);
if(!p){playerData.innerHTML="<h3>No Bowling Data</h3>";return;}
renderStats(p,[["MATCHES","Matches"],["OVERS","Overs"],["WICKETS","Wickets"],["RUNS","Runs"],["ECONOMY","Economy"],["AVERAGE","Average"],["STRIKE RATE","SR"],["3-W","3W"],["5-W","5W"],["BEST","Best"]]);
}

function openPlayer(name){
showPlayer(name);
}

function loadLeaderboardPage(){
content.innerHTML=`
<div class="subTabs">
<button class="active" onclick="setActiveButton(this); loadBattingBoard()">BATTING</button>
<button onclick="setActiveButton(this); loadBowlingBoard()">BOWLING</button>
<button onclick="setActiveButton(this); loadMVP()">MVP</button>
</div>
<div id="board"></div>`;
loadBattingBoard();
}

function loadBattingBoard(sortKey="RUNS"){

if(sortKey==="Balls/bdry"){
s.sort((a,b)=>
(+a[sortKey]||999)-(+b[sortKey]||999)
);
}else{
s.sort((a,b)=>
(+b[sortKey]||0)-(+a[sortKey]||0)
);
}
let h=`
<select onchange="loadBattingBoard(this.value)">
<option value="RUNS" ${sortKey==="RUNS"?"selected":""}>Runs</option>
<option value="STRIKERATE" ${sortKey==="STRIKERATE"?"selected":""}>Strike Rate</option>
<option value="AVERAGE" ${sortKey==="AVERAGE"?"selected":""}>Average</option>
<option value="FOURS" ${sortKey==="FOURS"?"selected":""}>Fours</option>
<option value="SIXES" ${sortKey==="SIXES"?"selected":""}>Sixes</option>
<option value="Balls/bdry" ${sortKey==="Balls/bdry"?"selected":""}>Balls/Boundary</option>
<option value="50" ${sortKey==="50"?"selected":""}>50s</option>
</select>
`;
let sortName={
RUNS:"Runs",
AVERAGE:"Average",
STRIKERATE:"Strike Rate",
FOURS:"Fours",
SIXES:"Sixes",
"50":"50s"
};
s.forEach((p,i)=>{
let img=p.BATSMAN.toLowerCase()+".jpeg";
h+=`
<div class="player"
onclick="openPlayer('${p.BATSMAN}')">
<img src="${img}"
onerror="this.src='logo.png'">
<div style="flex:1">
<b>#${i+1} ${p.BATSMAN}</b>
<br>
<small>Runs:${p.RUNS}</small>
<small>   SR:${p.STRIKERATE}</small>
<small>   AVG:${p.AVERAGE}</small>
</div>
<div>
<b>${p[sortKey]}</b>
</div>
</div>
`;
});
board.innerHTML=h;
}

function loadBowlingBoard(sortKey="WICKETS"){
let s=[...bowlingData];
if(sortKey==="ECONOMY"||sortKey==="AVERAGE"||sortKey==="STRIKE RATE"){
s.sort((a,b)=>
(+a[sortKey]||999)-(+b[sortKey]||999)
);
}else{
s.sort((a,b)=>
(+b[sortKey]||0)-(+a[sortKey]||0)
);
}
let h=`
<select onchange="loadBowlingBoard(this.value)">
<option value="WICKETS" ${sortKey==="WICKETS"?"selected":""}>Wickets</option>
<option value="ECONOMY" ${sortKey==="ECONOMY"?"selected":""}>Economy</option>
<option value="AVERAGE" ${sortKey==="AVERAGE"?"selected":""}>Average</option>
<option value="STRIKE RATE" ${sortKey==="STRIKE RATE"?"selected":""}>Strike Rate</option>
<option value="3-W" ${sortKey==="3-W"?"selected":""}>3W</option>
<option value="5-W" ${sortKey==="5-W"?"selected":""}>5W</option>
</select>
`;
let sortName={
WICKETS:"Wickets",
ECONOMY:"Economy",
AVERAGE:"Average",
"STRIKE RATE":"Strike Rate",
"3-W":"3W",
"5-W":"5W"
};
s.forEach((p,i)=>{
let img=p.BOWLER.toLowerCase()+".jpeg";
h+=`
<div class="player"
onclick="openPlayer('${p.BOWLER}')">
<img src="${img}"
onerror="this.src='logo.png'">
<div style="flex:1">
<b>#${i+1} ${p.BOWLER}</b>
<br>
<small> Wickets:${p.WICKETS}</small>
<small> ECO:${p.ECONOMY}</small>
<small> SR:${p["STRIKE RATE"]}</small>
<small> AVG:${p.AVERAGE}</small>
</div>
<div>
<b>${p[sortKey]}</b>
</div>
</div>
`;
});
board.innerHTML=h;
}

function loadMVP(){
    if(!battingData.length || !bowlingData.length){
    board.innerHTML="<h3>Loading data...</h3>";
    return;
}
let players={};

battingData.forEach(p=>{
let battingScore =
(+p.RUNS || 0) * 1 +
(+p.AVERAGE || 0) * 2 +
(Math.max(0,(+p.STRIKERATE || 0) - 100)) * 2 +
(+p.FOURS || 0) * 1 +
(+p.SIXES || 0) * 2 +
(+p["50"] || 0) * 25;
if(!players[p.BATSMAN]){
players[p.BATSMAN]={
batting:0,
bowling:0
};
}
players[p.BATSMAN].batting=battingScore;
});

bowlingData.forEach(p=>{
let bowlingScore =
(+p.WICKETS || 0) * 20 +
(+p["3-W"] || 0) * 20 +
(+p["5-W"] || 0) * 50 +
Math.max(0,(12 - (+p.ECONOMY || 12))) * 20 +
Math.max(0,(15 - (+p["STRIKE RATE"] || 15))) * 10 +
Math.max(0,(20 - (+p.AVERAGE || 20))) * 10;
if(!players[p.BOWLER]){
players[p.BOWLER]={
batting:0,
bowling:0
};
}
players[p.BOWLER].bowling=bowlingScore;
});

let mvpList = Object.entries(players)
.map(([name,data]) => ({
name,
...data,
total:data.batting + data.bowling
}))
.sort((a,b)=>b.total-a.total);

mvpList.sort((a,b)=>b.total-a.total);

let s = mvpList;

let h="<h2>MVP Leaderboard</h2>";
s.forEach((p,i)=>{

let img=p.name.toLowerCase()+".jpeg";

let total=p.total;
h += `
<div class="player"
onclick="openPlayer('${p.name}')">
<img src="${img}" onerror="this.src='logo.png'">
<div style="flex:1">
<b>#${i+1} ${p.name}</b>
<br>
<small>
Batting: ${p.batting.toFixed(0)}
|
Bowling: ${p.bowling.toFixed(0)}
</small>
</div>
<div>
<b>${total.toFixed(0)}</b>
</div>
</div>
`;
});
board.innerHTML=h;
}

function getNextMilestone(value, milestones){
    for(let m of milestones){
        if(value < m){
            return m;
        }
    }
    return null;
}

function getMilestoneScore(stat,target){

    if(stat==="Runs"){
        return {
            500:100,
            750:200,
            1000:300,
            1500:400,
            2000:500,
            2500:600
        }[target] || 0;
    }

    if(stat==="Wickets"){
        return {
            50:150,
            100:350,
            150:550,
            200:750,
            250:950
        }[target] || 0;
    }

    if(stat==="Sixes"){
        return {
            50:80,
            75:140,
            100:220,
            150:320,
            200:420,
            250:520
        }[target] || 0;
    }

    if(stat==="Fours"){
        return {
            50:60,
            75:120,
            100:180,
            150:260,
            200:340
        }[target] || 0;
    }

    if(stat==="Matches"){
        return {
            50:40,
            100:100,
            150:180,
            200:260,
            250:340
        }[target] || 0;
    }

    return 0;
}

function loadMilestones(){

let milestones = [];

/* RUNS */
battingData.forEach(p=>{
    let value = +p.RUNS || 0;
    let next = getNextMilestone(value,[500,750,1000,1500,2000,2500]);

    if(next && (next-value)<=50){
        milestones.push({
            player:p.BATSMAN,
            stat:"Runs",
            current:value,
            target:next,
            remaining:next-value,
            icon:"🏏"
        });
    }
});

/* WICKETS */
bowlingData.forEach(p=>{
    let value = +p.WICKETS || 0;
    let next = getNextMilestone(value,[50,100,150,200,250]);

    if(next && (next-value)<=12){
        milestones.push({
            player:p.BOWLER,
            stat:"Wickets",
            current:value,
            target:next,
            remaining:next-value,
            icon:"🥎"
        });
    }
});

/* SIXES */
battingData.forEach(p=>{
    let value = +p.SIXES || 0;
    let next = getNextMilestone(value,[50,100,150,200,250]);

    if(next && (next-value)<=10){
        milestones.push({
            player:p.BATSMAN,
            stat:"Sixes",
            current:value,
            target:next,
            remaining:next-value,
            icon:"💥"
        });
    }
});

/* FOURS */
battingData.forEach(p=>{
    let value = +p.FOURS || 0;
    let next = getNextMilestone(value,[50,100,150,200]);

    if(next && (next-value)<=10){
        milestones.push({
            player:p.BATSMAN,
            stat:"Fours",
            current:value,
            target:next,
            remaining:next-value,
            icon:"⚡"
        });
    }
});

/* MATCHES */
battingData.forEach(p=>{
    let value = +p.MATCHES || 0;
    let next = getNextMilestone(value,[50,100,150,200,250]);

    if(next && (next-value)<=6){
        milestones.push({
            player:p.BATSMAN,
            stat:"Matches",
            current:value,
            target:next,
            remaining:next-value,
            icon:"🎮"
        });
    }
});

milestones.sort((a,b)=>{

    let scoreA = getMilestoneScore(a.stat,a.target);
    let scoreB = getMilestoneScore(b.stat,b.target);

    if(scoreA !== scoreB)
        return scoreB - scoreA;

    return a.remaining - b.remaining;
});

let html = `
<h2>🎯 Milestone Tracker</h2>
<p>THESE GUYS ARE NEAR TO THESE MILESTONES</P>
<div class="statsGrid">
`;

milestones.forEach(m=>{
    html += `
    <div class="card">
        <div class="label">
            ${m.icon} ${m.stat}
        </div>

        <div class="value">
            ${m.current}/${m.target}
        </div>

        <p>
            <b>${m.player}</b>
        </p>

        <p>
            ${m.remaining} Away
        </p>
    </div>
    `;
});

html += "</div>";

content.innerHTML = html;
}

function oversToBalls(overs){

    overs = String(overs);

    let parts = overs.split(".");

    let completeOvers = parseInt(parts[0]) || 0;
    let balls = parseInt(parts[1]) || 0;

    return completeOvers * 6 + balls;
}

function loadRecords(){
if(!battingData.length || !bowlingData.length){
    content.innerHTML="<h3>Loading data...</h3>";
    return;
}

let topRunScorer =

    if(wa !== wb)
        return wa > wb ? a : b;

    return extractRunsGiven(a.BEST) < extractRunsGiven(b.BEST) ? a : b;
});

(totalRuns * 100) / Math.max(1,totalBalls);

Math.max(1,totalWickets);

let bowlingStrikeRate =
totalBallsBowled /
Math.max(1,totalWickets);

(totalBallsBowled % 6);
