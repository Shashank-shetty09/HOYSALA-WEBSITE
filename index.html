<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoysala Cricket Team</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{margin:0;font-family:Segoe UI,sans-serif;background:#f3f4f6}
#logoScreen{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:url("jersey.png") center/cover;color:#fff}
#logoScreen img{width:180px}
#logoScreen button{padding:12px 30px;font-size:18px;border:none;border-radius:8px;background:#d71920;color:#fff}
#app{display:none}
.header{background:#d71920;color:#fff;padding:20px;display:flex;align-items:center;gap:15px}
.header img{width:90px;height:90px;background:#fff;border-radius:10px;padding:5px}
.mainTabs,.subTabs,.playerTabs{display:flex;background:#fff}
.mainTabs button,.subTabs button,.playerTabs button{flex:1;padding:14px;border:none;background:#fff;font-weight:700}
.section{padding:15px}
.player{background:#fff;margin:10px 0;padding:14px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer}
.profileTop{display:flex;gap:15px;background:#fff;padding:15px;border-radius:10px}
.profileTop img{width:140px;height:140px;object-fit:cover;border-radius:10px}
.playerName{display:flex;align-items:center;font-size:28px;font-weight:bold}
.statsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:15px}
.card{background:#fff;padding:15px;border-radius:10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.label{font-size:13px;color:#666}
.value{font-size:28px;font-weight:bold;color:#0b1f4d}
table{width:100%;border-collapse:collapse;background:#fff}
th{background:#0b1f4d;color:#fff}
th,td{padding:10px;border:1px solid #ddd;text-align:center}
.backBtn{margin:10px 0;padding:10px 15px;border:none;background:#d71920;color:#fff;border-radius:8px}
</style>
</head>
<body>
<div id="logoScreen">
<img src="logo.png"><h1>HOYSALA CRICKET TEAM</h1>
<button onclick="enterSite()">VISIT</button>
</div>

<div id="app">
<div class="header"><img src="logo.png"><div><h2>HOYSALA</h2><div>Cricket Team</div></div></div>
<div class="mainTabs">
<button onclick="openTab('members')">MEMBERS</button>
<button onclick="openTab('leaderboard')">LEADERBOARD</button>
</div>
<div id="content" class="section"></div>
</div>

<script>
let battingData=[],bowlingData=[];

fetch("HOYSALA_STATS.xlsx").then(r=>r.arrayBuffer()).then(d=>{
const wb=XLSX.read(d,{type:"array"});
battingData=XLSX.utils.sheet_to_json(wb.Sheets["BATTING"],{defval:""});
bowlingData=XLSX.utils.sheet_to_json(wb.Sheets["BOWLING"],{defval:""});
});

function enterSite(){
logoScreen.style.display="none";
app.style.display="block";
openTab('members');
}

function openTab(tab){
if(tab==="members") loadMembers();
if(tab==="leaderboard") loadLeaderboardPage();
}

function loadMembers(){
let html="<h2>Team Members</h2>";
battingData.forEach(p=>{
html+=`<div class="player" onclick="showPlayer('${p.BATSMAN}')">${p.BATSMAN}</div>`;
});
content.innerHTML=html;
}

function showPlayer(name){
let img=name.toLowerCase()+".jpeg";
content.innerHTML=`
<button class="backBtn" onclick="loadMembers()">← Back</button>
<div class="profileTop">
<img src="${img}" onerror="this.src='logo.png'">
<div class="playerName">${name}</div>
</div>
<div class="playerTabs">
<button onclick="showBatting('${name}')">BATTING</button>
<button onclick="showBowling('${name}')">BOWLING</button>
</div>
<div id="playerData"></div>`;
showBatting(name);
}

function renderStats(obj,stats){
let h='<div class="statsGrid">';
stats.forEach(s=>h+=`<div class="card"><div class="label">${s[1]}</div><div class="value">${obj[s[0]]||0}</div></div>`);
h+='</div>';
playerData.innerHTML=h;
}

function showBatting(name){
let p=battingData.find(x=>x.BATSMAN===name);
renderStats(p,[["MATCHES","Matches"],["INNINGS","Innings"],["RUNS","Runs"],["BALLS","Balls"],["NOT OUTS","Not Outs"],["STRIKERATE","SR"],["AVERAGE","Average"],["FOURS","Fours"],["SIXES","Sixes"],["50","50s"],["BEST","Best"]]);
}

function showBowling(name){
let p=bowlingData.find(x=>x.BOWLER===name);
if(!p){playerData.innerHTML="<h3>No Bowling Data</h3>";return;}
renderStats(p,[["MATCHES","Matches"],["OVERS","Overs"],["WICKETS","Wickets"],["RUNS","Runs"],["ECONOMY","Economy"],["AVERAGE","Average"],["STRIKE RATE","SR"],["3-W","3W"],["5-W","5W"],["BEST","Best"]]);
}

function loadLeaderboardPage(){
content.innerHTML=`
<div class="subTabs">
<button onclick="loadBattingBoard()">BATTING</button>
<button onclick="loadBowlingBoard()">BOWLING</button>
<button onclick="loadMVP()">MVP</button>
</div>
<div id="board"></div>`;
loadBattingBoard();
}

function loadBattingBoard(){
let s=[...battingData].sort((a,b)=>(+b.RUNS||0)-(+a.RUNS||0));
let h='<table><tr><th>Player</th><th>Runs</th><th>Avg</th><th>SR</th><th>4s</th><th>6s</th></tr>';
s.forEach(p=>h+=`<tr><td>${p.BATSMAN}</td><td>${p.RUNS}</td><td>${p.AVERAGE}</td><td>${p.STRIKERATE}</td><td>${p.FOURS}</td><td>${p.SIXES}</td></tr>`);
h+='</table>'; board.innerHTML=h;
}

function loadBowlingBoard(){
let s=[...bowlingData].sort((a,b)=>(+b.WICKETS||0)-(+a.WICKETS||0));
let h='<table><tr><th>Bowler</th><th>Wkts</th><th>Eco</th><th>Avg</th><th>3W</th><th>5W</th></tr>';
s.forEach(p=>h+=`<tr><td>${p.BOWLER}</td><td>${p.WICKETS}</td><td>${p.ECONOMY}</td><td>${p.AVERAGE}</td><td>${p["3-W"]}</td><td>${p["5-W"]}</td></tr>`);
h+='</table>'; board.innerHTML=h;
}

function loadMVP(){
let players={};
battingData.forEach(p=>{
let score=(+p.RUNS||0)+(+p.FOURS||0)+((+p.SIXES||0)*2)+((+p["50"]||0)*20)+((+p.AVERAGE||0)*0.3)+((+p.STRIKERATE||0)*0.1);
players[p.BATSMAN]=(players[p.BATSMAN]||0)+score;
});
bowlingData.forEach(p=>{
let score=((+p.WICKETS||0)*25)+((+p["3-W"]||0)*15)+((+p["5-W"]||0)*35)+((15-(+p.ECONOMY||15))*2)+((20-(+p.AVERAGE||20)))+((15-(+p.STRIKERATE||15)));
players[p.BOWLER]=(players[p.BOWLER]||0)+score;
});
let s=Object.entries(players).sort((a,b)=>b[1]-a[1]);
let h='<table><tr><th>Rank</th><th>Player</th><th>MVP</th></tr>';
s.forEach((p,i)=>h+=`<tr><td>${i+1}</td><td>${p[0]}</td><td>${p[1].toFixed(1)}</td></tr>`);
h+='</table>'; board.innerHTML=h;
}
</script>
</body>
</html>
